# Добавьте этот блок в services существующего docker-compose.yaml.
  ocr-shim:
    container_name: ocr-shim
    image: tgr484/ocr-shim:2.0.1
    build: ./ocr-shim
    restart: unless-stopped
    networks:
      - internal
    environment:
      SELF_BASE_URL: http://ocr-shim:8000
      OCR_SHARED_SECRET: ${OCR_API_KEY}
      MDDOC_URL: ${MDDOC_URL:-http://mddoc:8000}
      MDDOC_API_KEY: ${MDDOC_API_KEY_OCRSHIM}
      MDDOC_ENGINE: ${MDDOC_ENGINE:-}
      MDDOC_DESCRIBE_PDF_FIGURES: ${MDDOC_DESCRIBE_PDF_FIGURES:-true}
      MDDOC_TIMEOUT: ${MDDOC_TIMEOUT:-1800}
      MDDOC_POLL_INTERVAL: ${MDDOC_POLL_INTERVAL:-5}
      MDDOC_HTTP_TIMEOUT: ${MDDOC_HTTP_TIMEOUT:-30}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-62914560}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Для HTTPS к MDdoc с внутренним CA раскомментируйте mount и добавьте
    # CA_CERT: /app/ca.crt в environment.
    # volumes:
    #   - ./librechat/RN-T.RU.crt:/app/ca.crt:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
